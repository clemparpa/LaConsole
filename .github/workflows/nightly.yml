name: Nightly

# 'schedule' and 'workflow_dispatch' events can never originate from a fork
# (scheduled runs execute on the repository's default branch), so unlike ci.yml
# no anti-fork guard is needed here.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }} (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parse_input, resolve_path]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rust-src
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 30 min
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1800

  mutants:
    name: cargo mutants (score >= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants
      - name: Mutation testing on resolve.rs + parse.rs
        run: cargo mutants --file crates/la-console/src/resolve.rs --file crates/la-console/src/parse.rs --minimum-mutant-score 80
