[package]
name = "la-console"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Confined fake console driven by an AI agent over a line-by-line JSON protocol"

[dependencies]
clap = { version = "4", features = ["derive"] }
grep = "0.3"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
thiserror = "2"
toml = "1.2.2"
wax = "0.7"

[dev-dependencies]
proptest = "1"
tempfile = "3"

# OS abstraction layer (spec/platform.md): only used by the cfg(windows) code.
# winapi-util (already transitive via same-file) reads volume serial + file
# index + link count via GetFileInformationByHandle — same-file 1.x only
# exposes dev()/ino() on unix.
[target.'cfg(windows)'.dependencies]
dunce = "1"
winapi-util = "0.1"
